{% extends 'base.html' %}
{% load static %}

{% block title %}FloodGuard - Sensor Map{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .map-page-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .map-page-footer { display: none; }

        /* Alert zone animations */
        .alert-zone { transition: fill-opacity 0.5s ease, stroke-width 0.5s ease; }
        .alert-zone-offline { stroke-dasharray: 5, 10; animation: zone-dash 2s linear infinite; }
        .alert-zone-rising { animation: zone-pulse-rise 2s ease-in-out infinite; }
        .alert-zone-falling { animation: zone-pulse-fall 2s ease-in-out infinite; }
        .alert-zone-stable { fill-opacity: 0.08; }
        .alert-zone-warning { animation: zone-pulse-warning 2.5s ease-in-out infinite; }
        .alert-zone-danger { animation: zone-pulse-danger 2s ease-in-out infinite; }
        .alert-zone-critical { animation: zone-pulse-critical 1.2s ease-in-out infinite; stroke-width: 3; }

        @keyframes zone-pulse-critical {
            0%, 100% { fill-opacity: 0.08; stroke-width: 3; }
            50% { fill-opacity: 0.25; stroke-width: 4; }
        }
        @keyframes zone-pulse-danger {
            0%, 100% { fill-opacity: 0.08; stroke-width: 1; }
            50% { fill-opacity: 0.20; stroke-width: 2; }
        }
        @keyframes zone-pulse-warning {
            0%, 100% { fill-opacity: 0.06; }
            50% { fill-opacity: 0.15; }
        }
        @keyframes zone-pulse-rise {
            0%, 100% { fill-opacity: 0.08; }
            50% { fill-opacity: 0.18; }
        }
        @keyframes zone-pulse-fall {
            0%, 100% { fill-opacity: 0.10; }
            50% { fill-opacity: 0.04; }
        }
        @keyframes zone-dash {
            to { stroke-dashoffset: -30; }
        }

        /* Droplet marker pulse */
        .droplet-pulse-active {
            position: absolute;
            border: 2px solid currentColor;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: marker-pulse 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes marker-pulse {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.3; }
            100% { transform: translate(-50%, -50%) scale(0.6); opacity: 0.8; }
        }

        /* Sidebar sensor pulse for critical */
        .sidebar-sensor-critical { animation: sidebar-critical 1.2s ease-in-out infinite; }
        @keyframes sidebar-critical {
            0%, 100% { border-left-color: #dc3545; background: rgba(220,53,69,0.05); }
            50% { border-left-color: #ff6b6b; background: rgba(220,53,69,0.15); }
        }
    </style>
{% endblock %}

{% block content %}
    <div class="map-page map-page-container">
        <aside class="map-sidebar glass" id="map-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    <span class="sidebar-icon">&#x1F4CA;</span>
                    <h2>Sensors</h2>
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle">
                    <span class="toggle-icon">&#9776;</span>
                </button>
            </div>
            <div class="sidebar-sensors" id="sidebar-sensors"></div>
            <div class="sidebar-legend">
                <div class="legend-item"><span class="legend-dot legend-normal"></span> Normal</div>
                <div class="legend-item"><span class="legend-dot legend-warning"></span> Warning</div>
                <div class="legend-item"><span class="legend-dot legend-danger"></span> Danger</div>
                <div class="legend-item"><span class="legend-dot legend-critical"></span> Critical</div>
                <div class="legend-item"><span class="legend-dot legend-offline"></span> Offline</div>
            </div>
        </aside>

        <div class="map-container">
            <div id="sensor-map" class="sensor-map"></div>

            <div class="map-controls">
                <button class="map-ctrl-btn" id="satellite-toggle" title="Toggle satellite view">
                    <span class="ctrl-icon">&#x1F30D;</span>
                    <span class="ctrl-label">Satellite</span>
                </button>
                <button class="map-ctrl-btn" id="lines-toggle" title="Toggle connection lines">
                    <span class="ctrl-icon">&#x1F4CF;</span>
                    <span class="ctrl-label">Lines</span>
                </button>
                <button class="map-ctrl-btn active" id="recenter-btn" title="Recenter map">
                    <span class="ctrl-icon">&#x21BA;</span>
                    <span class="ctrl-label">Recenter</span>
                </button>
            </div>

            <div class="timeline-panel" id="timeline-panel">
                <div class="timeline-header">
                    <span class="timeline-title">&#x1F4C5; Timeline</span>
                    <span class="timeline-label" id="timeline-label">Live</span>
                </div>
                <input type="range" id="timeline-slider" class="timeline-slider" min="0" max="100" value="100" />
                <div class="timeline-ticks">
                    <span>24h ago</span>
                    <span>18h</span>
                    <span>12h</span>
                    <span>6h</span>
                    <span>Now</span>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{% static 'js/map.js' %}"></script>
{% endblock %}
